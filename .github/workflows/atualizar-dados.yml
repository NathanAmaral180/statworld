# Rotina automática: todo dia de manhã, baixa os dados novos das fontes oficiais,
# confere se o site continua funcionando e, só então, publica (grava no GitHub; a Cloudflare publica sozinha).
# Explicação em português simples: scripts/atualizar/LEIA-ME.md
name: Atualizar dados

on:
  schedule:
    - cron: '0 10 * * *' # todo dia às 10h (horário de Greenwich) = 7h em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions do GitHub, para rodar na hora
    inputs:
      semanal:
        description: 'Rodar também os scripts semanais (Novo Caged)?'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/atualizar-dados.yml", "scripts/**"] # roda quando a rotina ou um script de dados muda (serve de teste)

permissions:
  contents: write # para gravar os dados novos no repositório

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo # datas no horário de Brasília
    steps:
      - name: Pegar o projeto
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Baixar os dados novos
        run: |
          # Segunda-feira, ou quando pedido no botão: roda também os semanais (Novo Caged, arquivo grande).
          if [ "$(date +%u)" = "1" ] || [ "${{ inputs.semanal }}" = "true" ]; then
            node scripts/atualizar/rodar.mjs --semanal
          else
            node scripts/atualizar/rodar.mjs
          fi

      - name: Conferir se o site continua funcionando
        run: npm run build

      - name: Publicar, se algum número mudou
        run: |
          if git diff --quiet -- dados; then
            echo "Nenhum número novo hoje. Nada a publicar."
            exit 0
          fi
          git config user.name "statworld-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git commit -m "Dados atualizados automaticamente em $(date +%Y-%m-%d)"
          git push
