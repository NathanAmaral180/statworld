  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"af8e828f-563d-4375-83c9-6ebe0f09508a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet><meta name=\"design_doc_mode\" content=\"canvas\"><title>StatWorld · Fios<\u002Ftitle><script src=\"617d4fdc-d54b-4ee0-abda-6a2501bb6f2b\"><\u002Fscript><style>*{box-sizing:border-box}body{margin:0;background:#E6E7EA;color:#111318;font-family:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;-webkit-font-smoothing:antialiased}a{color:#2557C7}a:hover{color:#111318}<\u002Fstyle><\u002Fhelmet>\n<div style=\"padding:56px 64px 96px;display:grid;gap:72px;width:max-content;min-width:100%\">\n  <header style=\"max-width:900px;display:grid;gap:14px\">\n    <div style=\"display:flex;align-items:center;gap:14px;color:#2557C7\"><svg width=\"56\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" style=\"overflow:visible\"><path d=\"M3 17.5c3.2 0 4.2-11 9-11s5.8 11 9 11\" style=\"fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round\"><\u002Fpath><circle cx=\"3\" cy=\"17.5\" r=\"1.9\" style=\"fill:currentColor\"><\u002Fcircle><circle cx=\"12\" cy=\"6.5\" r=\"1.9\" style=\"fill:#E6E7EA;stroke:currentColor;stroke-width:1.5\"><\u002Fcircle><circle cx=\"21\" cy=\"17.5\" r=\"1.9\" style=\"fill:currentColor\"><\u002Fcircle><\u002Fsvg><h1 style=\"margin:0;font-size:44px;letter-spacing:-.025em;font-weight:600;color:#111318\">StatWorld · Fios<\u002Fh1><\u002Fdiv>\n    <p style=\"margin:0;font-size:17px;line-height:1.55;color:#50565F;text-wrap:pretty\">Proposta da seção Fios para a trilha piloto “Do telégrafo ao smartphone”: 36 itens, 6 faixas, 39 ligações e 8 surpresas. As telas abaixo funcionam: toque nos itens, troque Cartão e Mapa, arraste o mapa. As surpresas encontradas ficam salvas neste aparelho. Fotos carregadas direto do Wikimedia Commons, com autor e licença.<\u002Fp>\n  <\u002Fheader>\n\n  <section data-screen-label=\"Identidade\" style=\"display:grid;gap:20px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Logotipo e ícones das faixas<\u002Fh2>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:stretch\">\n      <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <div style=\"{{ t.box }}\">\n          <div style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap\">\n            <span style=\"display:flex;align-items:center;gap:12px;color:var(--accent)\"><svg width=\"62\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" style=\"overflow:visible\"><path d=\"M3 17.5c3.2 0 4.2-11 9-11s5.8 11 9 11\" style=\"fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round\"><\u002Fpath><circle cx=\"3\" cy=\"17.5\" r=\"1.9\" style=\"fill:currentColor\"><\u002Fcircle><circle cx=\"12\" cy=\"6.5\" r=\"1.9\" style=\"fill:var(--bg);stroke:currentColor;stroke-width:1.5\"><\u002Fcircle><circle cx=\"21\" cy=\"17.5\" r=\"1.9\" style=\"fill:currentColor\"><\u002Fcircle><\u002Fsvg><b style=\"font-size:40px;letter-spacing:-.03em;font-weight:600;color:var(--ink)\">Fios<\u002Fb><\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase\"><svg width=\"30\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" style=\"overflow:visible\"><path d=\"M3 17.5c3.2 0 4.2-11 9-11s5.8 11 9 11\" style=\"fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round\"><\u002Fpath><circle cx=\"3\" cy=\"17.5\" r=\"2.1\" style=\"fill:currentColor\"><\u002Fcircle><circle cx=\"12\" cy=\"6.5\" r=\"2.1\" style=\"fill:var(--bg);stroke:currentColor;stroke-width:1.6\"><\u002Fcircle><circle cx=\"21\" cy=\"17.5\" r=\"2.1\" style=\"fill:currentColor\"><\u002Fcircle><\u002Fsvg>Fios<\u002Fspan>\n            <span style=\"display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--bg)\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" style=\"overflow:visible\"><path d=\"M3 17.5c3.2 0 4.2-11 9-11s5.8 11 9 11\" style=\"fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round\"><\u002Fpath><circle cx=\"3\" cy=\"17.5\" r=\"2.2\" style=\"fill:currentColor\"><\u002Fcircle><circle cx=\"12\" cy=\"6.5\" r=\"2.2\" style=\"fill:var(--accent);stroke:currentColor;stroke-width:1.8\"><\u002Fcircle><circle cx=\"21\" cy=\"17.5\" r=\"2.2\" style=\"fill:currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--sub);max-width:52ch\">Um fio que sobe e desce entre três itens: o do meio é o escolhido, vazado; os das pontas são o que veio antes e depois. Traço 1,5, a mesma grade 24 × 24 dos ícones.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px\">\n            <sc-for list=\"{{ lanes }}\" as=\"l\" hint-placeholder-count=\"6\">\n              <figure style=\"margin:0;border:1px solid var(--line);display:grid;justify-items:center;gap:8px;padding:12px 6px 10px\">\n                <span style=\"display:flex;align-items:flex-end;gap:10px;color:var(--ink)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ l.d }}\"><\u002Fpath><\u002Fsvg><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" style=\"fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ l.d }}\"><\u002Fpath><\u002Fsvg><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" style=\"fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ l.d }}\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <figcaption style=\"font-size:11.5px;color:var(--sub);text-align:center;line-height:1.3\">{{ l.name }}<\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ rels }}\" as=\"r\" hint-placeholder-count=\"7\"><span style=\"font-size:12.5px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 7px\">{{ r }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Molduras\" style=\"display:grid;gap:20px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Molduras por época<\u002Fh2>\n    <p style=\"margin:-8px 0 0;max-width:820px;font-size:15px;line-height:1.55;color:#50565F;text-wrap:pretty\">A moldura conta o tempo; a foto e o texto continuam no centro. Cinco épocas, cada uma com papel, filtro da foto e tipo do ano próprios. Itens do Brasil ganham uma fita verde e amarela no alto da moldura e o selo “Brasil”. Item sem foto mostra a placa da época com o ícone da faixa e o ano, e pede uma foto livre.<\u002Fp>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"{{ t.row }}\">\n        <sc-for list=\"{{ eras }}\" as=\"e\" hint-placeholder-count=\"5\">\n          <div style=\"width:300px;display:grid;gap:10px;align-content:start\">\n            <div style=\"display:grid;gap:2px\"><b style=\"font-size:15px;color:var(--ink)\">{{ e.name }} · {{ e.label }}<\u002Fb><span style=\"font-size:12.5px;line-height:1.4;color:var(--sub)\">{{ e.note }}<\u002Fspan><\u002Fdiv>\n            <dc-import name=\"Fios Cartao\" id=\"{{ e.sample }}\" compact=\"{{ true }}\" hint-size=\"300px,470px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Surpresas\" style=\"{{ eggVars }}\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Surpresas para caçar<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,auto));gap:28px;max-width:1300px;font-size:14.5px;line-height:1.5;color:#50565F\">\n      <p style=\"margin:0;max-width:40ch\"><b style=\"color:#111318\">Quando:<\u002Fb> só em feitos de comemorar. Itens sobre guerras, acidentes ou tragédias nunca recebem surpresa.<\u002Fp>\n      <p style=\"margin:0;max-width:40ch\"><b style=\"color:#111318\">Como:<\u002Fb> 2 a 3 segundos, só sobre a foto. O texto não é coberto. Um aviso pequeno conta “Surpresa encontrada · 4 de 8”.<\u002Fp>\n      <p style=\"margin:0;max-width:40ch\"><b style=\"color:#111318\">Movimento reduzido:<\u002Fb> a animação vira a imagem parada ao lado de cada uma. No mapa, a estrela vazada marca onde há surpresa, sem dizer qual; achada, ela fica amarela.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,420px);gap:16px\">\n      <sc-for list=\"{{ eggTiles }}\" as=\"g\" hint-placeholder-count=\"9\">\n        <figure style=\"margin:0;background:#fff;border:1px solid rgba(17,19,24,.1);border-radius:12px;padding:12px;display:grid;gap:10px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#4A5262,#1D222B)\">{{ g.anim }}<\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#4A5262,#1D222B)\">{{ g.still }}<span style=\"position:absolute;right:6px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:3px\">parado<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"display:grid;gap:2px\"><b style=\"font-size:14.5px\">{{ g.y }} · {{ g.name }}<\u002Fb><span style=\"font-size:13px;color:#50565F\">{{ g.fx }}<\u002Fspan><\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Movimento\" style=\"display:grid;gap:20px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">Flutuar e puxar o fio<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,360px));gap:28px;font-size:14.5px;line-height:1.5;color:#50565F\">\n      <p style=\"margin:0\"><b style=\"color:#111318\">Flutuar.<\u002Fb> Cada item sobe e desce 1 a 2 px em ritmos diferentes, como boias. O mapa anda com o dedo ou arrastando o mouse e desliza um pouco ao soltar.<\u002Fp>\n      <p style=\"margin:0\"><b style=\"color:#111318\">Puxar.<\u002Fb> Ao tocar num item, os vizinhos ligados a ele se aproximam alguns pixels com um pequeno tranco; as ligações dele esticam e ficam azuis, as outras ficam frouxas e apagadas.<\u002Fp>\n      <p style=\"margin:0\"><b style=\"color:#111318\">Andar no tempo.<\u002Fb> O mapa rola sozinho para centralizar o escolhido. A faixa no topo mostra a época de cada trecho, a mesma das molduras. Com movimento reduzido, tudo muda sem animação.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1180px;background:#fff;padding:16px;border-radius:14px\">\n      <dc-import name=\"Fios Mapa\" selected=\"{{ demoSel }}\" on-select=\"{{ demoPick }}\" phrases=\"{{ true }}\" hint-size=\"100%,510px\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"1 Celular cartão\" style=\"display:grid;gap:24px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">1 · Celular, cartão<\u002Fh2>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:56px;align-items:flex-start;padding:12px\">\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · item do Brasil com foto (1877)<\u002Fspan><dc-import name=\"Fios Celular\" theme=\"{{ t.id }}\" start=\"telbr2\" path=\"morse,telegrafo,telefone,telbr2\" found=\"{{ 3 }}\" hint-size=\"390px,1700px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · momento da surpresa: o cartão toca (1973)<\u002Fspan><dc-import name=\"Fios Celular\" theme=\"{{ t.id }}\" start=\"celular\" path=\"valvula,transistor,celular\" found=\"{{ 4 }}\" egg-demo=\"{{ true }}\" hint-size=\"390px,1700px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · item sem foto, fontes abertas (1858)<\u002Fspan><dc-import name=\"Fios Celular\" theme=\"{{ t.id }}\" start=\"cabo\" path=\"morse,telegrafo,cabo\" found=\"{{ 1 }}\" src-open=\"{{ true }}\" hint-size=\"390px,1700px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · com “reduzir movimento” (2020)<\u002Fspan><dc-import name=\"Fios Celular\" theme=\"{{ t.id }}\" start=\"pix\" path=\"web,netbr,pix\" found=\"{{ 8 }}\" egg-demo=\"{{ true }}\" reduced=\"{{ true }}\" hint-size=\"390px,1700px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section data-screen-label=\"2 Celular mapa\" style=\"display:grid;gap:24px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">2 · Celular, mapa<\u002Fh2>\n    <div style=\"display:flex;gap:56px;align-items:flex-start;padding:12px\">\n      <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }}<\u002Fspan><dc-import name=\"Fios Celular\" theme=\"{{ t.id }}\" start=\"transistor\" mode=\"map\" path=\"valvula,transistor\" found=\"{{ 3 }}\" hint-size=\"390px,844px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"3 Computador\" style=\"display:grid;gap:24px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">3 · Computador<\u002Fh2>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }}<\u002Fspan>\n        <div style=\"width:1440px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(17,19,24,.12),0 20px 50px -24px rgba(0,0,0,.35)\"><dc-import name=\"Fios Computador\" theme=\"{{ t.id }}\" start=\"atlantico\" path=\"morse,marconi,atlantico\" found=\"{{ 2 }}\" hint-size=\"1440px,1150px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section data-screen-label=\"4 Trilhas e destaque\" style=\"display:grid;gap:24px\">\n    <h2 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em\">4 · /fios e destaque na página inicial<\u002Fh2>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:40px;align-items:flex-start\">\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · /fios<\u002Fspan><div style=\"width:1440px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(17,19,24,.12)\"><dc-import name=\"Fios Trilhas\" theme=\"{{ t.id }}\" hint-size=\"1440px,980px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;gap:14px;padding:12px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · /fios no celular<\u002Fspan><dc-import name=\"Fios Trilhas\" theme=\"{{ t.id }}\" device=\"phone\" hint-size=\"390px,1800px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:40px;align-items:flex-start\">\n        <div style=\"display:grid;gap:14px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · página inicial<\u002Fspan><div style=\"width:1440px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(17,19,24,.12)\"><dc-import name=\"Fios Trilhas\" theme=\"{{ t.id }}\" view=\"home\" hint-size=\"1440px,560px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;gap:14px;padding:12px\"><span style=\"font-size:13px;color:#50565F\">{{ t.label }} · página inicial no celular<\u002Fspan><dc-import name=\"Fios Trilhas\" theme=\"{{ t.id }}\" device=\"phone\" view=\"home\" hint-size=\"390px,1000px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { tick: 0, demoSel: 'transistor' };\n  componentDidMount() {\n    this._t = setInterval(() => { if (window.FIOS && window.FIOS_EGG) { clearInterval(this._t); this.forceUpdate(); } }, 60);\n    this._l = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 3400);\n  }\n  componentWillUnmount() { clearInterval(this._t); clearInterval(this._l); }\n  renderVals() {\n    const F = window.FIOS, E = window.FIOS_EGG;\n    const themes = ['light', 'dark'].map(id => ({ id, label: id === 'light' ? 'Tema claro' : 'Tema escuro',\n      box: Object.assign({}, F ? F.vars[id] : {}, { width: 640, background: 'var(--bg)', color: 'var(--ink)', padding: 28, borderRadius: 14, display: 'grid', gap: 18, alignContent: 'start' }),\n      row: Object.assign({}, F ? F.vars[id] : {}, { display: 'flex', gap: 24, padding: 28, borderRadius: 14, background: 'var(--bg)', alignItems: 'flex-start' }) }));\n    if (!F) return { themes, lanes: [], rels: [], eras: [], eggTiles: [] };\n    const samples = { gravura: 'telbr2', album: 'atlantico', filme: 'celular', tela: 'dynatac', digital: 'pix' };\n    const R = React.createElement, k = this.state.tick;\n    const tiles = F.items.filter(i => i.egg).map(i => ({ y: i.y, name: i.name, kind: i.egg, fx: F.eggs[i.egg] }));\n    tiles.push({ y: 2002, name: 'Brasil pentacampeão (trilha Esporte)', kind: 'fogos', fx: F.eggs.fogos });\n    return {\n      themes, lanes: F.lanes, rels: ['tornou possível', 'levou a', 'deu lugar a', 'abriu caminho para', 'foi usado em', 'inspirou', 'chegou ao Brasil:'],\n      eras: F.eras.map(e => ({ name: e.name, label: e.label, note: e.note, sample: samples[e.id] })),\n      eggTiles: tiles.map(t => ({ y: t.y, name: t.name, fx: t.fx,\n        anim: E ? R('div', { key: t.kind + k, style: { position: 'absolute', inset: 0 } }, E(t.kind, false)) : null,\n        still: E ? E(t.kind, true) : null })),\n      eggVars: Object.assign({}, F.vars.light, { display: 'grid', gap: 20, background: 'transparent', color: '#111318' }),\n      demoSel: this.state.demoSel, demoPick: (id) => this.setState({ demoSel: id })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
