  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"183692a4-46b0-4a6e-97d4-f4ec08997103\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n\n<style>html,body{margin:0;background:#E9EAEC}a{color:#2557C7;text-decoration:none}a:hover{text-decoration:underline}<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#E9EAEC;color:#111318;padding:48px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;min-width:1900px\">\n  <h1 style=\"font-size:24px;margin:0 0 6px;font-weight:600\">StatWorld · Saúde, molde por país e por estado<\u002Fh1>\n  <p style=\"margin:0 0 32px;color:#50565F;font-size:15px;max-width:110ch;line-height:1.5\">Visão geral, dez abas em quatro grupos, São Paulo por município e a ficha de um município. Temas claro e escuro, desktop (1440) e celular (375). Todos os números são exemplos (“00,0”) com o selo Exemplo; cores, barras e ordens são ilustrativas, só para mostrar a forma. Clique em “abrir” para ver a tela em tamanho real e interagir.<\u002Fp>\n\n  <section data-screen-label=\"Abas e níveis\" style=\"margin-bottom:64px;background:#fff;border-radius:8px;padding:28px 32px;box-shadow:0 0 0 1px rgba(17,19,24,.12);max-width:1780px\">\n    <h2 style=\"font-size:17px;margin:0 0 4px;font-weight:600\">Abas propostas e o que cada uma mostra em cada nível<\u002Fh2>\n    <p style=\"margin:0 0 20px;color:#50565F;font-size:14px;max-width:120ch\">Nível 1: Visão geral e quatro grupos. Nível 2: as abas do grupo. Esperança de vida é só um link para Demografia. Quando a fonte não tem o nível, a aba usa uma das situações já existentes.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:170px 230px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);font-size:14px;line-height:1.45\">\n      <div style=\"padding:8px 12px 8px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#50565F;font-weight:600;border-bottom:1px solid rgba(17,19,24,.22)\">Grupo<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#50565F;font-weight:600;border-bottom:1px solid rgba(17,19,24,.22)\">Aba<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#50565F;font-weight:600;border-bottom:1px solid rgba(17,19,24,.22)\">Forma<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#50565F;font-weight:600;border-bottom:1px solid rgba(17,19,24,.22)\">País por estado<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#50565F;font-weight:600;border-bottom:1px solid rgba(17,19,24,.22)\">Estado por município<\u002Fdiv>\n\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1);font-weight:600\">Visão geral<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Visão geral<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mapa, ficha e ranking com busca e região. Quatro medidas: mortes padronizadas por idade, mortalidade infantil, médicos por mil, gasto público por habitante.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mapa azul dos estados<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mapa dos municípios em cinzas, destaque na cor da bandeira; média de 3 anos abaixo de 20 mil hab.; “poucos casos” abaixo de 5 mil<\u002Fdiv>\n\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1);font-weight:600\">Nascer e morrer<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Causas de morte<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Cada 100 mortes em barras 100% (lugar, estado, país); taxa por causa em pontos sobre a mesma régua; idade × sexo em barras 100%; pequenos múltiplos de 1996 a hoje com a pandemia marcada e o último ano tracejado.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo; poucos casos: soma de 5 anos e aviso no lugar das taxas<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mortalidade infantil e materna<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mapa e ranking; na materna, o ranking mostra a faixa provável. Série desde 1996 abaixo do mapa.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Infantil com média de 3 anos; materna só acima de 100 mil hab., os demais pontilhados<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Nascimentos<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Cada 100 bebês: quatro grades de 10 × 10 (pré-natal, cesárea, mães até 19 anos, baixo peso) e nascidos vivos por ano.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo; poucos nascimentos: soma de 5 anos<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Esperança de vida ↗<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Link para Demografia.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Link<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Link<\u002Fdiv>\n\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1);font-weight:600\">Prevenção e hábitos<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Vacinação<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Quanto falta para a meta: barra de cobertura, traço da meta, parte riscada que falta e uma fileira de anos com meta atingida.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Doenças acompanhadas<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Semana a semana contra a faixa dos 5 anos anteriores, selo Semanal e últimas semanas preliminares; doenças anuais em colunas por ano, sem selo semanal.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo; poucos casos no ranking<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Como as pessoas estão<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Saúde autoavaliada em barras 100% por sexo e idade; doenças crônicas e hábitos em pontos com a margem da pesquisa.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Só o número do estado<\u002Fdiv>\n\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1);font-weight:600\">Atendimento<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Rede de saúde<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Profissionais e leitos por mil habitantes em mapa (cinco medidas); tempo até o hospital mais perto em barras 100%, selo Estimativa.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Profissionais e leitos completos; tempo até o hospital em breve<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1)\"><\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Internações e procedimentos<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Motivos de internação em lista de barras e série mensal; onde os moradores são internados em barras 100%, filtradas por região.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv>\n\n      <div style=\"padding:10px 12px 10px 0;border-bottom:1px solid rgba(17,19,24,.1);font-weight:600\">Gasto e planos<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Gasto público<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Mapa por habitante e “quem paga” (União, estado, municípios) em barra 100%; link para Contas públicas, função COFOG 07.<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid rgba(17,19,24,.1)\">Completo<\u002Fdiv>\n      <div style=\"padding:10px 12px 10px 0\"><\u002Fdiv><div style=\"padding:10px 12px\">Planos de saúde<\u002Fdiv><div style=\"padding:10px 12px\">Mapa da parte da população com plano, cada 100 pessoas em grade e série desde 2000.<\u002Fdiv><div style=\"padding:10px 12px\">Completo<\u002Fdiv><div style=\"padding:10px 12px\">Completo<\u002Fdiv>\n    <\u002Fdiv>\n    <h3 style=\"font-size:15px;margin:28px 0 8px;font-weight:600\">Situações e selos novos<\u002Fh3>\n    <div style=\"display:flex;gap:28px;flex-wrap:wrap;font-size:14px;color:#50565F\">\n      <span style=\"display:flex;gap:8px;align-items:center\"><i style=\"width:28px;height:16px;display:block;background:repeating-linear-gradient(135deg,#B4BAC3 0 1px,#fff 1px 4px);box-shadow:inset 0 0 0 1px rgba(17,19,24,.1)\"><\u002Fi>Sem dado, hachura (nunca zero)<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><i style=\"width:28px;height:16px;display:block;background:radial-gradient(circle at 2px 2px,#50565F 0.9px,#fff 1.2px) 0 0/5px 5px;box-shadow:inset 0 0 0 1px rgba(17,19,24,.1)\"><\u002Fi>Poucos casos para comparar, pontilhado<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border:1px dashed rgba(17,19,24,.22);border-radius:4px;padding:2px 6px\">Preliminar<\u002Fspan>Período mais recente ainda incompleto; trecho tracejado nas linhas, colunas claras e riscadas<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:13px;color:#111318\">00,0<sup style=\"color:#676D76\">†<\u002Fsup><\u002Fspan>Média de 3 anos<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"6\">\n    <section style=\"margin-bottom:64px\" data-screen-label=\"{{ s.title }}\">\n      <div style=\"display:flex;gap:12px;align-items:baseline;margin:0 0 6px\">\n        <h2 style=\"font-size:17px;margin:0;font-weight:600\">{{ s.title }}<\u002Fh2>\n        <a href=\"{{ s.url }}\" target=\"_blank\" style=\"font-size:14px\">abrir<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 14px;color:#50565F;font-size:14px;max-width:120ch\">{{ s.desc }}<\u002Fp>\n      <div style=\"display:flex;gap:24px;align-items:flex-start\">\n        <div style=\"width:576px;height:720px;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12);background:#fff;position:relative;flex:none\">\n          <iframe src=\"{{ s.dl }}\" loading=\"lazy\" title=\"desktop claro\" style=\"width:1440px;height:1800px;border:0;transform:scale(.4);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#111318;color:#fff;padding:2px 6px;border-radius:4px\">desktop · claro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:576px;height:720px;overflow:hidden;border-radius:8px;background:#0E1013;position:relative;flex:none\">\n          <iframe src=\"{{ s.dd }}\" loading=\"lazy\" title=\"desktop escuro\" style=\"width:1440px;height:1800px;border:0;transform:scale(.4);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#fff;color:#111318;padding:2px 6px;border-radius:4px\">desktop · escuro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:240px;height:720px;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12);background:#fff;position:relative;flex:none\">\n          <iframe src=\"{{ s.ml }}\" loading=\"lazy\" title=\"celular claro\" style=\"width:375px;height:1125px;border:0;transform:scale(.64);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#111318;color:#fff;padding:2px 6px;border-radius:4px\">celular · claro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:240px;height:720px;overflow:hidden;border-radius:8px;background:#0E1013;position:relative;flex:none\">\n          <iframe src=\"{{ s.md }}\" loading=\"lazy\" title=\"celular escuro\" style=\"width:375px;height:1125px;border:0;transform:scale(.64);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#fff;color:#111318;padding:2px 6px;border-radius:4px\">celular · escuro<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ s.hasAlt }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:24px;align-items:flex-start;margin-top:20px\">\n          <sc-for list=\"{{ s.alt }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"display:grid;gap:8px\">\n              <div style=\"font-size:13px;color:#50565F;display:flex;gap:10px\">{{ a.label }} <a href=\"{{ a.url }}\" target=\"_blank\">abrir<\u002Fa><\u002Fdiv>\n              <div style=\"width:576px;height:520px;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12);background:#fff\">\n                <iframe src=\"{{ a.url }}\" loading=\"lazy\" title=\"{{ a.label }}\" style=\"width:1440px;height:1300px;border:0;transform:scale(.4);transform-origin:0 0\"><\u002Fiframe>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals(){\n    const S=[\n      ['p=geral','1 · Visão geral, Brasil por estado','Mapa, ficha do estado e ranking longo com busca e filtro por região. Quatro medidas, todas por habitante; mortes padronizadas por idade.',[['Mortalidade infantil','p=geral&m=inf'],['Gasto público por habitante','p=geral&m=gasto']]],\n      ['p=obitos','2 · Causas de morte','De que se morre em cada lugar: cada 100 mortes em barras 100% e a taxa padronizada de cada causa contra o país. Causa mal definida em hachura, como medida da qualidade do registro.',[['Por idade e sexo','p=obitos&v=idade'],['Ao longo do tempo, 1996 a hoje','p=obitos&v=tempo']]],\n      ['p=infantil','3 · Mortalidade infantil e materna','Mapa e ranking com a série desde 1996 abaixo. Na materna, poucos casos por ano: média de três anos e faixa provável no ranking.',[['Mortalidade materna','p=infantil&m=mat']]],\n      ['p=nasc','4 · Nascimentos','Cada 100 bebês nascidos vivos, em quatro grades de 10 × 10, com estado e país ao lado. Nascidos vivos por ano abaixo.',[]],\n      ['p=vac','5 · Vacinação','Quanto falta para a meta, vacina por vacina, e em quais anos a meta foi atingida. Ano corrente preliminar.',[]],\n      ['p=doencas','6 · Doenças acompanhadas','Dengue semana a semana contra a faixa dos cinco anos anteriores; últimas semanas preliminares. Selo Semanal só nas doenças com fonte semanal.',[['Tuberculose, anual','p=doencas&d=tb']]],\n      ['p=pns','7 · Como as pessoas estão','Pesquisa Nacional de Saúde: saúde autoavaliada em barras 100%, doenças crônicas e hábitos com a margem da pesquisa. Selo Estimativa.',[['Doenças crônicas','p=pns&v=chronic'],['Só o número do estado, no nível municipal','lv=SP&p=pns']]],\n      ['p=rede','8 · Rede de saúde','Profissionais e leitos por mil habitantes, cinco medidas no mesmo mapa.',[['Tempo até o hospital mais perto','p=rede&v=tempo'],['Em breve, no nível municipal','lv=SP&p=rede&v=tempo']]],\n      ['p=sus','9 · Internações e procedimentos','Por que as pessoas são internadas no SUS e a série mensal, com os três últimos meses preliminares.',[['Onde os moradores são internados','p=sus&v=onde'],['Mesma vista em São Paulo, por região','lv=SP&p=sus&v=onde']]],\n      ['p=gasto','10 · Gasto público','Gasto público em saúde por habitante e quem paga, com link para Contas públicas (COFOG 07).',[]],\n      ['p=planos','11 · Planos de saúde','Parte da população com plano: mapa, cada 100 pessoas e série desde 2000.',[]],\n      ['lv=SP&p=geral','12 · São Paulo por município, Visão geral','Municípios em cinzas, o escolhido na cor da bandeira. Ranking de 645 municípios com busca e região intermediária; média de 3 anos (†) e “poucos casos” pontilhado.',[['Mortalidade infantil, municípios pequenos pontilhados','lv=SP&p=geral&m=inf']]],\n      ['lv=SP&p=obitos','13 · São Paulo por município, Causas de morte (sem mapa)','Município, estado e país lado a lado em barras 100% e pontos sobre a mesma régua.',[['Município com poucos casos (Borá)','lv=SP&p=obitos&u=3507209'],['Município com média de 3 anos (Areiópolis)','lv=SP&p=obitos&u=3503604']]],\n      ['lv=SP&p=ficha&u=3507506','14 · Ficha do município','Todos os números de saúde de Botucatu ao lado de São Paulo e do Brasil, por grupo. Mostra “só o número do estado”, “em breve”, meta e link para Demografia.',[]]\n    ];\n    const u=(q,t)=>{const R=window.__resources||{}, x=q+(t?'&theme='+t:''); return R.pg_saude? R.pg_saude+'#'+x : 'Saude.dc.html?'+x;};\n    return {screens:S.map(([q,title,desc,alt])=>({title,desc,url:u(q,'light'),dl:u(q,'light'),dd:u(q,'dark'),ml:u(q,'light'),md:u(q,'dark'),hasAlt:alt.length>0,alt:alt.map(([label,aq])=>({label,url:u(aq,'light')}))}))};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
