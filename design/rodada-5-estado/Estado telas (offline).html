  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

faint)}\n.fld-x{all:unset;cursor:pointer;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--sub)}\n.fld-x:hover{background:var(--surf);color:var(--ink)}\n.fld-x:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}\n.fld-x[hidden]{display:none}\n.cb{position:relative}\n.cb-l{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;list-style:none;margin:0;padding:6px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12)}\n.cb-l[hidden]{display:none}\n.cb-l li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:15px;color:var(--sub)}\n.cb-l li b{color:var(--ink);font-weight:600}\n.cb-l li .nm{color:var(--ink)}\n.cb-l li small{color:var(--faint);font-size:13px;white-space:nowrap}\n.cb-l li.act,.cb-l li:hover{background:var(--surf)}\n.cb-l li.act{box-shadow:inset 0 0 0 1px var(--line2)}\n.cb-l .cb-e{cursor:default;color:var(--sub)}\n.cb-l .cb-e:hover{background:none}\n/* resumo do estado */\n.est-sum{display:flex;gap:6px 24px;flex-wrap:wrap;margin-top:14px;font-size:15px;color:var(--sub)}\n.est-sum b{color:var(--ink);font-weight:600}\n/* ferramentas do mapa */\n.mtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}\n.mtools .cb{flex:1 1 100%}\n.sel-w{position:relative;display:inline-flex;align-items:center}\n.sel-w select{appearance:none;-webkit-appearance:none;height:40px;padding:0 38px 0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;max-width:100%}\n.sel-w select:hover{border-color:var(--ink)}\n.sel-w select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n.sel-w.on select{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.sel-w svg{position:absolute;right:14px;pointer-events:none;color:var(--sub)}\n.sel-w.on svg{color:var(--bg)}\n.lk{all:unset;cursor:pointer;color:var(--accent);font-size:15px;font-weight:500}\n.lk:hover{text-decoration:underline}\n.lk[hidden]{display:none}\n.lk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}\n/* mapa dos municípios */\n.mm{position:relative;margin-top:12px;overflow:hidden;border-radius:12px;transition:box-shadow .2s}\n.mm.zoomed{box-shadow:inset 0 0 0 1px var(--line)}\n.mm svg{display:block;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}\n.mm.zoomed svg{touch-action:none;cursor:grab}\n.mm.drag svg{cursor:grabbing}\n.mm svg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}\n.mm .mu{stroke:var(--bg);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .25s}\n.mm .mu.out{fill:var(--track)!important;pointer-events:none}\n.mm .rb{fill:none;stroke:var(--ink);stroke-opacity:.6;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}\n.mm .sb{fill:none;stroke:var(--sub);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}\n.mm .hov{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}\n.mm .sel{fill:none;stroke:var(--ink);stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}\n.mm .sel2{fill:none;stroke:var(--bg);stroke-width:5.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}\n.mm .ml{font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;pointer-events:none}\n.mm .ml.s{font-weight:700}\n.mm .ml.r{font-weight:500;fill:var(--sub);letter-spacing:.04em}\n.mm .cap{fill:var(--ink);stroke:var(--bg);vector-effect:non-scaling-stroke;stroke-width:1.5;pointer-events:none}\n.mm-z{position:absolute;right:12px;top:12px;display:grid;background:var(--bg);border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}\n.mm-z button{all:unset;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:20px;line-height:1}\n.mm-z button+button{border-top:1px solid var(--line)}\n.mm-z button:hover{background:var(--surf)}\n.mm-z button:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}\n.mm-z button:disabled{color:var(--faint);opacity:.5;cursor:default;background:none}\n.mm-z .ic{font-size:18px}\n.mm-pick{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--bg);border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px}\n.mm-pick[hidden]{display:none}\n.mm-pick-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 10px;font-size:14px;color:var(--sub)}\n.mm-pick ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}\n.mm-pick li button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px;padding:0 10px;border-radius:6px;font-size:16px;color:var(--ink)}\n.mm-pick li button span{font-size:13px;color:var(--faint)}\n.mm-pick li button:hover,.mm-pick li button:focus-visible{background:var(--surf)}\n.mm-hint{margin:10px 0 0;font-size:13px;color:var(--faint)}\n.lg-l{display:grid;gap:8px;font-size:13px;color:var(--sub)}\n.lg-l i{height:12px;width:44px;display:block;background:linear-gradient(var(--ink),var(--ink)) center/100% 1.5px no-repeat;opacity:.7}\n/* ranking longo */\n.rk-tools{display:grid;gap:14px;margin-bottom:10px}\n.rk-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 0 0 14px}\n.rk-pin{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin:0 0 10px;box-shadow:0 4px 12px rgba(0,0,0,.06)}\n.rk-pin small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}\n.rk-pin b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.rk-pin span{font-size:14px;color:var(--sub)}\n.rk-pin .lk{grid-row:1/4;grid-column:2;font-size:14px}\n.rk-more{flex-wrap:wrap;gap:8px 16px}\n.rk-more div{display:flex;gap:20px}\n/* ficha */\n.card .go{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--faint)}\n.card a.go{color:var(--accent);font-weight:500}\n.card a.go:hover{text-decoration:none}\n.card .meta .lk{font-size:14px}\n.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:0 14px;margin-top:12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:500;font-size:15px}\n.cta:hover{text-decoration:none;border-color:var(--ink)}\n.cta .ic{font-size:18px}\n/* abas sem mapa dos municípios */\n.est-empty{margin-top:40px;max-width:680px;display:grid;gap:14px;justify-items:start}\n.est-empty h2{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.est-empty h2 .soon{font-size:12px;padding:2px 6px}\n.est-empty p{margin:0;font-size:17px;line-height:1.55;color:var(--sub);text-wrap:pretty}\n.est-empty p b{color:var(--ink);font-weight:500}\n.est-empty .lnk{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:16px;margin-top:4px}\n.est-also{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;color:var(--sub);display:flex;flex-wrap:wrap;gap:8px 20px;justify-self:stretch}\n/* anúncio: só abaixo do bloco mapa + ranking */\n.ad{margin:56px auto 0;max-width:970px;height:90px;border:1px dashed var(--line2);border-radius:8px;display:grid;place-items:center;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase}\n@media (max-width:640px){\n .pk{position:static}\n .pk-pop{left:0;right:0;width:auto;top:calc(100% + 8px)}\n .pk-l{max-height:60vh}\n .est-sum{font-size:14px;gap:4px 16px;margin-top:10px}\n .mtools{margin-top:12px;gap:10px}\n .mtools .sel-w{flex:1 1 auto}\n .mtools .sel-w select{width:100%;height:44px}\n .mm{margin-left:-20px;margin-right:-20px;border-radius:0}\n .mm-z{right:10px;top:10px}\n .mm-z button{width:44px;height:44px}\n .rk-top{padding-left:8px}\n .rk-pin{padding:10px 12px}\n .est-empty{margin-top:28px}\n .est-empty h2{font-size:23px}\n .est-empty p{font-size:16px}\n .ad{height:100px;max-width:320px;margin-top:40px}\n}\n<\u002Fstyle>\n<style>html,body{background:#E9EAEC !important}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#E9EAEC;color:#111318;padding:48px;font-family:ui-sans-serif,system-ui,sans-serif;min-width:1900px\">\n  <h1 style=\"font-size:24px;margin:0 0 6px;font-weight:600\">StatWorld · Economia, página do estado (molde por município)<\u002Fh1>\n  <p style=\"margin:0 0 40px;color:#50565F;font-size:15px;max-width:110ch\">Piloto São Paulo (645 municípios) e o extremo pequeno, Roraima (15). Mesma família das páginas do Brasil: cabeçalho, abas em dois níveis, ficha, selos e carimbo “fonte · data”. Todos os valores são textos de exemplo (00,0%, 000º de 645) com o selo “exemplo”; as malhas e as regiões são do IBGE. Desktop 1440 e celular 375, claro e escuro. Clique em “abrir” para usar a tela em tamanho real.<\u002Fp>\n\n  <section data-screen-label=\"0 Entrada pelo mapa do Brasil\" style=\"margin-bottom:64px\">\n    <h2 style=\"font-size:17px;margin:0 0 4px;font-weight:600\">0 · Entrada pelo mapa do Brasil<\u002Fh2>\n    <p style=\"margin:0 0 16px;color:#50565F;font-size:14px;max-width:110ch\">Na ficha do estado, em todas as abas do Brasil que têm mapa dos municípios, um botão leva à página do estado na mesma aba. Nas abas sem mapa dos municípios, o botão diz “Ver a página de São Paulo”.<\u002Fp>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\">\n      <div data-theme=\"light\" style=\"width:488px;background:var(--bg);color:var(--ink);padding:24px;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12)\">\n        <div class=\"card\">\n          <div class=\"meta\">Sudeste · 00º de 27 estados com dado<\u002Fdiv>\n          <div class=\"row1\"><div class=\"nm\">São Paulo<\u002Fdiv><div class=\"big\">+0,0<small>%<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"meta\" style=\"font-size:13px;color:var(--faint)\">Crescimento do PIB · IBGE, Contas Regionais<\u002Fdiv>\n          <a class=\"cta\" href=\"Estado.dc.html?uf=SP\">Ver os municípios de São Paulo<svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-theme=\"dark\" style=\"width:488px;background:var(--bg);color:var(--ink);padding:24px;border-radius:8px\">\n        <div class=\"card\">\n          <div class=\"meta\">Sudeste · 00º de 27 estados com dado<\u002Fdiv>\n          <div class=\"row1\"><div class=\"nm\">São Paulo<\u002Fdiv><div class=\"big\">+0,0<small>%<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"meta\" style=\"font-size:13px;color:var(--faint)\">Crescimento do PIB · IBGE, Contas Regionais<\u002Fdiv>\n          <a class=\"cta\" href=\"Estado.dc.html?uf=SP&amp;theme=dark\">Ver os municípios de São Paulo<svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-theme=\"light\" style=\"width:375px;box-sizing:border-box;background:var(--bg);color:var(--ink);padding:20px;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12)\">\n        <div class=\"card\" style=\"padding:16px 18px\">\n          <div class=\"meta\">Sudeste · 00º de 27<\u002Fdiv>\n          <div class=\"row1\"><div class=\"nm\" style=\"font-size:22px\">São Paulo<\u002Fdiv><div class=\"big\" style=\"font-size:38px\">+0,0<small>%<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <a class=\"cta\" href=\"Estado.dc.html?uf=SP\">Ver os municípios<svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:360px;font-size:14px;line-height:1.5;color:#50565F;display:grid;gap:8px\">\n        <b style=\"color:#111318;font-weight:600\">Por que um botão e não o clique no mapa<\u002Fb>\n        <span>No mapa do Brasil o clique já escolhe o estado e atualiza a ficha. Manter esse gesto e pôr a saída na ficha evita que a pessoa saia da página sem querer.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"9\">\n    <section style=\"margin-bottom:64px\" data-screen-label=\"{{ s.title }}\">\n      <div style=\"display:flex;gap:12px;align-items:baseline;margin:0 0 6px\">\n        <h2 style=\"font-size:17px;margin:0;font-weight:600\">{{ s.title }}<\u002Fh2>\n        <a href=\"{{ s.open }}\" target=\"_blank\" style=\"font-size:14px;color:#2557C7\">abrir<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 14px;color:#50565F;font-size:14px;max-width:120ch\">{{ s.desc }}<\u002Fp>\n      <div style=\"display:flex;gap:24px;align-items:flex-start\">\n        <div style=\"width:605px;height:630px;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12);background:#fff;position:relative\">\n          <iframe src=\"{{ s.dl }}\" loading=\"lazy\" title=\"desktop claro\" style=\"width:1440px;height:1500px;border:0;transform:scale(.42);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#111318;color:#fff;padding:2px 6px;border-radius:4px\">desktop · claro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:605px;height:630px;overflow:hidden;border-radius:8px;background:#0E1013;position:relative\">\n          <iframe src=\"{{ s.dd }}\" loading=\"lazy\" title=\"desktop escuro\" style=\"width:1440px;height:1500px;border:0;transform:scale(.42);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#fff;color:#111318;padding:2px 6px;border-radius:4px\">desktop · escuro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:250px;height:630px;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(17,19,24,.12);background:#fff;position:relative\">\n          <iframe src=\"{{ s.ml }}\" loading=\"lazy\" title=\"celular claro\" style=\"width:375px;height:945px;border:0;transform:scale(.6667);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#111318;color:#fff;padding:2px 6px;border-radius:4px\">celular · claro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:250px;height:630px;overflow:hidden;border-radius:8px;background:#0E1013;position:relative\">\n          <iframe src=\"{{ s.md }}\" loading=\"lazy\" title=\"celular escuro\" style=\"width:375px;height:945px;border:0;transform:scale(.6667);transform-origin:0 0\"><\u002Fiframe>\n          <span style=\"position:absolute;right:8px;top:8px;font-size:11px;background:#fff;color:#111318;padding:2px 6px;border-radius:4px\">celular · escuro<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals(){\n    const CAMP='3509502';\n    const S=[\n      ['1 · Visão geral de São Paulo, Campinas escolhida',`uf=SP&sel=${CAMP}`,'','Mapa dos 645 municípios com contorno fino entre cidades e contorno forte entre as 11 regiões intermediárias. Ficha com posição no estado e no Brasil, média, diferença, região e link “em breve” para a página da cidade. Ranking mostra os 10 primeiros e a cidade escolhida. No celular: mapa → ficha → ranking; a busca fica logo acima do mapa.'],\n      ['2 · Busca aberta, resultado escolhido e mapa aproximado',`uf=SP&sel=${CAMP}&q=Camp&zoom=sel`,'&scroll=search','Busca sem acento e por parte do nome (“Camp” acha Campinas, Campos do Jordão, Campo Limpo Paulista…), com a região ao lado para desfazer nomes repetidos. Escolher aproxima o mapa até a cidade, com nomes das vizinhas. Setas e Enter funcionam no teclado.'],\n      ['3 · Filtro por região ativo: Campinas',`uf=SP&sel=${CAMP}&reg=3510`,'&scroll=mtools','O mapa vai até a região e apaga o resto do estado; o ranking passa a ter só os 87 municípios da região, e a ficha ganha “posição na região”. “Ver o estado inteiro” desfaz o filtro. Escolher pela busca uma cidade fora da região desfaz o filtro sozinho.'],\n      ['4 · Ranking aberto, cidade escolhida fora do topo',`uf=SP&pos=312&more=100&scroll=rank`,'','“Ver todos” abre os 50 primeiros e depois “mostrar mais 50”. A faixa “Sua cidade” fica presa no topo da lista enquanto se rola, com a posição e “Ir para a posição”, que abre o que faltar e leva até a linha. Maiores ou menores troca a ordem sem perder a cidade.'],\n      ['5 · Aba só com o número do estado: Trabalho e renda',`uf=SP&tab=trab`,'','A barra é a mesma do Brasil. Aviso curto “Este dado não existe por município” com o porquê, série no tempo e ficha do estado com a posição entre os 27 e link para o mapa dos estados.'],\n      ['6 · Aba sem dado neste nível: Dinheiro e juros',`uf=SP&tab=din`,'','Aviso curto e link para a mesma aba do Brasil. Abaixo, as abas que têm mapa dos municípios deste estado.'],\n      ['7 · Aba em breve: Preços e poder de compra',`uf=SP&tab=precos`,'','A fonte existe e a página ainda não foi feita: mostra a fonte prevista e leva à mesma aba do Brasil enquanto isso. O estado de cada aba vem da configuração e pode mudar por estado (em Roraima, Preços fica “sem dado”).'],\n      ['8 · Troca de estado aberta na trilha',`uf=SP&crumb=1`,'','Os 27 estados agrupados por região do país, com busca. Trocar de estado mantém a aba atual. Esc fecha e devolve o foco ao botão.'],\n      ['9 · Visão geral de Roraima, 15 municípios',`uf=RR`,'','O mesmo molde no extremo pequeno: 2 regiões intermediárias, ranking inteiro sem “ver todos” (até 15 linhas aparecem todas) e mapa alto encaixado no mesmo quadro.']\n    ];\n    const R=window.__resources||{}; const u=(p,t,x='')=>R.pg_estado?`${R.pg_estado}#${p}&theme=${t}${x}`:`Estado.dc.html?${p}&theme=${t}${x}`;\n    return {screens:S.map(([title,p,mx,desc])=>({title,desc,open:u(p,'light'),dl:u(p,'light'),dd:u(p,'dark'),ml:u(p,'light',mx),md:u(p,'dark',mx)}))};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
