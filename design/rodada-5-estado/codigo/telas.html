<style>/* StatWorld · base aprovada (1c) + extensões do molde + navegação em dois níveis. Copiado das páginas do Brasil, sem mudanças. */
/* Base aprovada (1c) */
:root{
--bg:#FFFFFF;--surf:#F3F4F6;--ink:#111318;--sub:#50565F;--faint:#676D76;--accent:#2557C7;--hatch:#B4BAC3;--track:#EDEFF2;--bar:#B9C6DC;--line:rgba(17,19,24,.10);--line2:rgba(17,19,24,.22);--on-strong:#FFFFFF;
--r0:oklch(0.925 0.032 250);--r1:oklch(0.855 0.055 250);--r2:oklch(0.775 0.088 252);--r3:oklch(0.665 0.125 254);--r4:oklch(0.535 0.145 257);--r5:oklch(0.395 0.125 260);
--p-soja:oklch(0.66 0.13 140);--p-milho:oklch(0.85 0.14 95);--p-cana:oklch(0.72 0.10 185);--p-cafe:oklch(0.50 0.07 50);--p-gado:oklch(0.62 0.15 30);--p-frango:oklch(0.76 0.11 350);--p-leite:oklch(0.83 0.06 235);--p-mandioca:oklch(0.58 0.11 305);--p-arroz:oklch(0.80 0.07 70);
--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme=dark]{
--bg:#0E1013;--surf:#171A1F;--ink:#ECEEF1;--sub:#A7ADB6;--faint:#8F959E;--accent:#86AEF7;--hatch:#434951;--track:#1F232A;--bar:#3D4A60;--line:rgba(236,238,241,.12);--line2:rgba(236,238,241,.26);--on-strong:#111318;
--r0:oklch(0.315 0.035 255);--r1:oklch(0.405 0.065 255);--r2:oklch(0.505 0.095 254);--r3:oklch(0.615 0.115 252);--r4:oklch(0.735 0.105 250);--r5:oklch(0.865 0.065 248);
--p-soja:oklch(0.62 0.11 140);--p-milho:oklch(0.80 0.12 95);--p-cana:oklch(0.66 0.09 185);--p-cafe:oklch(0.52 0.06 50);--p-gado:oklch(0.60 0.13 30);--p-frango:oklch(0.70 0.10 350);--p-leite:oklch(0.74 0.06 235);--p-mandioca:oklch(0.58 0.10 305);--p-arroz:oklch(0.74 0.06 70);
color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 56px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top-in{display:flex;align-items:center;gap:56px;height:72px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:20px;color:var(--ink);letter-spacing:-.01em}
.brand:hover{text-decoration:none}
.logo{display:grid;grid-template-columns:9px 9px;gap:2px}
.logo i{width:9px;height:9px;display:block}
.logo i:nth-child(1){background:var(--r2)}.logo i:nth-child(2){background:var(--r4)}.logo i:nth-child(3){background:var(--r4)}.logo i:nth-child(4){background:var(--r2)}
.top nav{display:flex;gap:28px;height:100%}
.top nav a{display:flex;align-items:center;color:var(--sub);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.top nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.top nav a:hover{text-decoration:none;color:var(--ink)}
.btn{margin-left:auto;background:var(--bg);border:1px solid var(--line2);border-radius:8px;height:40px;padding:0 16px;font-size:15px;cursor:pointer}
.btn:hover{background:var(--surf)}

.crumb{margin-top:36px;font-size:14px;color:var(--sub);display:flex;gap:6px}
.crumb a{color:var(--sub)}
h1.title{font-size:52px;line-height:1.05;letter-spacing:-.025em;font-weight:600;margin:14px 0 0}

/* Brasil hoje band */
.today{margin-top:32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));align-items:stretch}
.today-h{padding:18px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;display:flex;flex-direction:column;gap:4px}
.today-h span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);font-size:13px}
.kpi{padding:16px 24px;border-left:1px solid var(--line);display:grid;gap:4px;align-content:start}
.kpi-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi b{font-size:26px;font-weight:600;letter-spacing:-.01em}
.kpi .lbl{font-size:14px;color:var(--ink);text-wrap:pretty}
.kpi .src{font-size:12px;color:var(--faint)}

.freq{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--sub);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;line-height:1.3;white-space:nowrap}
.freq i{display:flex;gap:2px}.freq i s{width:3px;height:8px;background:var(--sub);display:block;opacity:.25}
.freq i s.on{opacity:1}

/* layers */
.layers{display:flex;gap:32px;margin-top:36px;border-bottom:1px solid var(--line)}
.layers a,.layers span{display:flex;align-items:center;gap:8px;padding:0 0 12px;font-size:17px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.layers a:hover{text-decoration:none;color:var(--ink)}
.layers .on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.layers .off{color:var(--faint);cursor:not-allowed}
.soon{font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--line2);border-radius:4px;padding:1px 5px;color:var(--faint)}

/* controls */
.ctrl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px}
.seg{display:inline-flex;background:var(--surf);border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;height:40px;padding:0 18px;border-radius:7px;font-size:16px;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:8px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);font-weight:500}
.seg.sm button{height:32px;font-size:14px;padding:0 12px}
.seg .note{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px;font-weight:400}
.sw-h{width:14px;height:10px;border-radius:2px;display:inline-block;background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 0 1px var(--line)}
.ctrl-lbl{font-size:13px;color:var(--sub)}
.prods{display:flex;gap:6px;flex-wrap:wrap}
.prod{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;font-size:15px;color:var(--sub)}
.prod .ic{font-size:20px}
.prod:hover{color:var(--ink);border-color:var(--ink)}
.prod.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}

/* map + side */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:56px;margin-top:20px;align-items:start}
.map{width:100%;height:auto;display:block;overflow:visible}
.map .st{cursor:pointer;stroke:var(--bg);stroke-width:.8;stroke-linejoin:round;transition:fill .25s}
.map .ol{fill:none;stroke:var(--line2);stroke-width:2}
.map .lab{font-size:12.5px;font-weight:600;fill:var(--ink);pointer-events:none;letter-spacing:.02em}
.map .lab.strong{fill:var(--on-strong)}
.map .lab.out{paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:auto;cursor:pointer}
.map .cl{stroke:var(--sub);stroke-width:.8}
.map .dot{fill:var(--ink)}
.map .hov{fill:none;stroke:var(--ink);stroke-width:1.5;pointer-events:none}
.map .sel{fill:none;stroke:var(--ink);stroke-width:2.6;pointer-events:none}
.map .chip{fill:var(--bg);stroke:var(--line2)}
.map .chipic{color:var(--ink)}
.legend{display:flex;gap:24px;align-items:flex-start;margin-top:12px;flex-wrap:wrap}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:88px;gap:2px}
.ramp div{display:grid;gap:8px;font-size:13px;color:var(--sub)}
.ramp i{height:12px;display:block}
.lg-h{display:grid;gap:8px;font-size:13px;color:var(--sub)}
.lg-h i{height:12px;width:88px;display:block;background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,var(--bg) 1px 5px);box-shadow:inset 0 0 0 1px var(--line)}
.lg-z i{background:var(--track);box-shadow:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 20px;width:100%}
.cat{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.cat i{width:14px;height:14px;border-radius:3px;display:block;flex:none}
.cat .ic{font-size:18px;color:var(--sub)}
.cat em{font-style:normal;white-space:nowrap;color:var(--faint);font-size:13px}

.side{display:grid;gap:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:20px 24px;display:grid;gap:6px}
.card .meta{font-size:14px;color:var(--sub)}
.card .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.card .nm{font-size:26px;font-weight:600;letter-spacing:-.01em}
.card .big{font-size:48px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.card .big small{font-size:17px;font-weight:500;color:var(--sub);margin-left:3px;letter-spacing:0}
.card .nodata{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--sub)}
.card .facts{display:grid;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.card .fact{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--sub)}
.card .fact b{color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px;text-align:right}
.card .fact .ic{font-size:18px}
.card .line{font-size:15px;color:var(--ink);display:flex;gap:8px;align-items:center;margin-top:4px}

.rk-h{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;padding:0 14px 8px}
.rk{list-style:none;margin:0;padding:0}
.rk li{display:grid;grid-template-columns:28px minmax(0,1fr) 120px 78px;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:16px;outline:none}
.rk li.ic-on{grid-template-columns:28px 20px minmax(0,1fr) 110px 78px}
.rk li .ic{font-size:18px;color:var(--sub)}
.rk li:hover,.rk li.hv{background:var(--surf)}
.rk li.on{background:var(--surf);font-weight:600}
.rk li:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.rk .n{color:var(--faint);font-size:14px}
.rk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:8px;background:var(--track);border-radius:1px;position:relative;overflow:hidden}
.rk .bar i{position:absolute;inset:0 auto 0 0;background:var(--bar);display:block}
.rk li.on .bar i{background:var(--accent)}
.rk .bar.h{background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px)}
.rk .bar.z{background:var(--track)}
.rk .v{text-align:right;font-size:15px}
.rk .v.nd{color:var(--faint);font-size:14px}
.rk .gap{height:20px;display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:14px;cursor:default}
.rk .gap:hover{background:none}
.rk-more{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.rk-more button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:15px;font-weight:500}
.rk-more span{color:var(--faint);font-size:13px}
.srcnote{font-size:13px;color:var(--faint);line-height:1.5;margin:0;padding:0 14px}
.srcnote b{font-weight:500;color:var(--sub)}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.side{max-width:560px}.today{grid-template-columns:repeat(3,minmax(0,1fr))}.today-h{grid-column:1/-1;padding-bottom:0}.kpi:nth-child(2){border-left:0;padding-left:0}.wrap{padding:0 28px}.top-in{gap:28px} }
footer.pg{margin-top:72px;border-top:1px solid var(--line);padding:24px 0 48px;font-size:13px;color:var(--faint)}

/* Soja · ao vivo */

.ph{display:flex;align-items:center;gap:20px;margin-top:18px}
.ph-ic{width:72px;height:72px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:40px}
.ph h1{margin:0}
.ph p{margin:6px 0 0;color:var(--sub);font-size:16px}
.ptabs{display:flex;gap:32px;margin-top:32px;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:none;padding:0 0 12px;font-size:17px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:8px}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.live{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;margin-top:32px}
.price-h{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub)}
.price{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price b{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1}
.price span{font-size:17px;color:var(--sub)}
.chg{display:flex;gap:0;margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chg div{padding:12px 28px 12px 0;margin-right:28px;border-right:1px solid var(--line);display:grid;gap:2px}
.chg div:last-child{border-right:0}
.chg small{font-size:13px;color:var(--sub)}
.chg b{font-size:22px;font-weight:600}
.chart-top{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-size:12px;fill:var(--faint)}
.chart .gl{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .xh{stroke:var(--line2)}
.chart .tip rect{fill:var(--ink)}
.chart .tip text{fill:var(--bg);font-size:13px}
.others h3,.hist h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin:0 0 4px}
.oth{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.oth .t{font-size:14px;color:var(--sub)}
.oth .v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oth .v b{font-size:24px;font-weight:600}
.oth .v span{color:var(--sub);font-size:14px}
.oth .s{font-size:12px;color:var(--faint)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;margin-top:32px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.tl b{font-size:22px;font-weight:600}
.tl p{margin:0;font-size:17px;line-height:1.55;max-width:60ch;text-wrap:pretty}
.read{display:block;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:24px}
.read:hover{text-decoration:none;border-color:var(--line2)}
.read small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
.read strong{display:block;font-size:28px;letter-spacing:-.015em;margin:10px 0 8px}
.read p{margin:0 0 16px;color:var(--sub);line-height:1.5}
.read span{color:var(--accent);display:flex;align-items:center;gap:6px;font-weight:500}
@media (max-width:1100px){.live,.hist{grid-template-columns:minmax(0,1fr)} }

/* Extensões do molde (Economia agrupada + telas novas). Usa só as variáveis do tema aprovado. */
body{min-height:100vh}
.wrap{width:100%}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;flex:none}
/* exemplo, selos, notas */
.ex{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--sub);background:var(--track);border-radius:4px;padding:2px 6px;line-height:1.3;white-space:nowrap}
.freq.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.stamp{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--faint);line-height:1.4}
.kpi .stamp{font-size:12px}
.mnote{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-size:15px;line-height:1.5;color:var(--sub);max-width:76ch;text-wrap:pretty}
.mnote .i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:2px;font-style:normal}
.mnote b{color:var(--ink);font-weight:600}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:4px}
.vh h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.vh p{margin:4px 0 0;color:var(--sub);font-size:15px}
.sec-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin:0}

/* gráficos */
.chart .band{fill:var(--track)}
.chart .bandl{fill:none;stroke:var(--line2);stroke-dasharray:3 3}
.chart .ref{stroke:var(--sub);stroke-dasharray:4 4}
.chart .reft{fill:var(--sub)}
.chart .col{fill:var(--bar)}
.chart .col.hl{fill:var(--accent)}
.chart .vl{font-size:13px;fill:var(--ink);font-weight:600}
.chart .ax{stroke:var(--line2)}
.chart .zero{stroke:var(--sub)}
.chart .ttl{font-size:13px;fill:var(--sub);font-weight:600}
.lg{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:6px}
.lg span{display:flex;align-items:center;gap:8px}
.lg i{width:18px;height:2px;background:var(--accent);display:block}
.lg i.b{height:10px;background:var(--track);box-shadow:inset 0 0 0 1px var(--line2)}

/* lista de barras grande */
.bl{list-style:none;margin:0;padding:0}
.bl-h{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.6fr) 120px 64px;gap:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;padding:0 14px 8px;border-bottom:1px solid var(--line)}
.bl li{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.6fr) 120px 64px;gap:12px;align-items:center;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line);font-size:17px;cursor:default}
.bl li:hover,.bl li.on{background:var(--surf)}
.bl .n{color:var(--faint);font-size:14px}
.bl .bar{height:14px;background:var(--track);border-radius:1px;position:relative;overflow:hidden}
.bl .bar i{position:absolute;inset:0 auto 0 0;background:var(--bar);display:block}
.bl li:hover .bar i,.bl li.on .bar i{background:var(--accent)}
.bl .bar.h{background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px)}
.bl .v{text-align:right;font-weight:600}
.bl .s{text-align:right;color:var(--sub);font-size:15px}
.bl .nd{color:var(--faint);font-weight:400;font-size:15px}

/* balança */
.bal{display:grid;gap:12px}
.bal-r{display:grid;grid-template-columns:110px minmax(0,1fr) 108px;gap:10px;align-items:center;font-size:14px;color:var(--sub)}
.bal-r .bar{height:22px;background:var(--track);position:relative}
.bal-r .bar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--bar)}
.bal-r .bar i.x{background:var(--accent)}
.bal-r b{color:var(--ink);font-weight:600;text-align:right;font-size:15px}
.bal-s{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
